[workspace]
resolver = "2"
members = [
    "crates/ksight-abi",
    "crates/ksight-model",
    "crates/ksight-protocol",
    "crates/ksight-core",
    "crates/ksight-agent",
    "crates/ksight-cli",
    "xtask",
]
default-members = [
    "crates/ksight-abi",
    "crates/ksight-model",
    "crates/ksight-protocol",
    "crates/ksight-core",
    "crates/ksight-agent",
    "crates/ksight-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["KernSight Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
aya = "=0.13.1"

ksight-model = { path = "crates/ksight-model" }
ksight-abi = { path = "crates/ksight-abi" }
ksight-protocol = { path = "crates/ksight-protocol" }
ksight-core = { path = "crates/ksight-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_os, values(\"android\"))"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
