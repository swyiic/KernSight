name: ci

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

# Match release verification; rust-toolchain.toml otherwise overrides the action default.
env:
  RUSTUP_TOOLCHAIN: 1.91.1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --manifest-path vendor/aya/Cargo.toml --lib maps::perf::perf_buffer::tests
      - run: python3 scripts/test_build_identity.py
      - run: cargo run -p xtask -- architecture

