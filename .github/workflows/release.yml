name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.91.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo run -p xtask -- architecture

  cli:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: kernsight-cli-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: kernsight-cli-linux-aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: kernsight-cli-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
      - name: Build CLI
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            host_target="$(rustc -vV | sed -n 's/^host: //p')"
            rust_lld="$(rustc --print sysroot)/lib/rustlib/${host_target}/bin/rust-lld"
            RUSTFLAGS="-C linker=${rust_lld}" cargo build --locked --release --target "${{ matrix.target }}" -p ksight-cli
          else
            cargo build --locked --release --target "${{ matrix.target }}" -p ksight-cli
          fi
      - name: Package CLI
        shell: bash
        run: |
          package_dir="${{ matrix.archive }}"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/ksightctl" "$package_dir/ksightctl"
          cp LICENSE README.md "$package_dir/"
          tar -czf "${package_dir}.tar.gz" "$package_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  android-device:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: aarch64-unknown-linux-musl
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm
      - name: Build agent and eBPF objects
        run: |
          make bpf BPF_CLANG=clang
          make device BPF_CLANG=clang
      - name: Package single-file Android device agent
        shell: bash
        run: |
          cp target/aarch64-unknown-linux-musl/release/ksightd ksightd-android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: kernsight-device-android-arm64
          path: ksightd-android-arm64
          if-no-files-found: error

  publish:
    needs: [cli, android-device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          mkdir -p release
          find artifacts -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'ksightd-android-arm64' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kernsight-release-bundle
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
