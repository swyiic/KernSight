name: release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/actions-20261010"
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.91.1

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --manifest-path vendor/aya/Cargo.toml --lib maps::perf::perf_buffer::tests
      - run: python3 scripts/test_build_identity.py
      - run: cargo run -p xtask -- architecture

  cli:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: kernsight-cli-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: kernsight-cli-linux-aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: kernsight-cli-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
      - name: Build CLI
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            host_target="$(rustc -vV | sed -n 's/^host: //p')"
            rust_lld="$(rustc --print sysroot)/lib/rustlib/${host_target}/bin/rust-lld"
            RUSTFLAGS="-C linker=${rust_lld}" cargo build --locked --release --target "${{ matrix.target }}" -p ksight-cli
          else
            cargo build --locked --release --target "${{ matrix.target }}" -p ksight-cli
          fi
      - name: Package CLI
        shell: bash
        run: |
          package_dir="${{ matrix.archive }}"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/ksightctl" "$package_dir/ksightctl"
          cp LICENSE README.md "$package_dir/"
          tar -czf "${package_dir}.tar.gz" "$package_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  android-device:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: aarch64-unknown-linux-musl
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm
      - name: Build agent and eBPF objects
        run: |
          make bpf BPF_CLANG=clang
          make device BPF_CLANG=clang
      - name: Package single-file Android device agent
        shell: bash
        run: |
          cp target/aarch64-unknown-linux-musl/release/ksightd ksightd-android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: kernsight-device-android-arm64
          path: ksightd-android-arm64
          if-no-files-found: error

  publish:
    needs: [cli, android-device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          mkdir -p release
          find artifacts -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'ksightd-android-arm64' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kernsight-release-bundle
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/actions-20261010'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          prerelease_args=()
          if [[ "${GITHUB_REF}" == "refs/heads/release/actions-20261010" ]]; then
            base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
            test -n "$base_version"
            release_tag="v${base_version}-build.${GITHUB_SHA:0:8}"
            prerelease_args=(--prerelease)
          fi
          cat > notes.md <<'EOF'
          KernSight device agent and host CLI.

          Assets:
          - ksightd-android-arm64: ARM64 Android device agent, statically linked
            for aarch64-unknown-linux-musl. Includes seven ordinary eBPF sensor
            objects and two qualified-code eBPF objects.
          - kernsight-cli-linux-x86_64.tar.gz: x86_64-unknown-linux-gnu host CLI.
          - kernsight-cli-linux-aarch64.tar.gz: aarch64-unknown-linux-musl host CLI.
          - kernsight-cli-macos-arm64.tar.gz: aarch64-apple-darwin host CLI.
          - SHA256SUMS: SHA-256 checksums for the four downloadable assets.

          Device compatibility:
          - ARM64 Android with root authorization and a security policy allowing
            the required BPF, perf-event and tracefs operations.
          - Baseline collection requires BPF ring-buffer maps/helpers, the
            probe-read helpers, and the BPF v3/atomic instructions emitted by
            this build. Required tracepoints and their record layouts must match.
          - Readable kernel BTF is not a universal requirement for ordinary
            tracepoint sensors. Qualified task-bound code collection additionally
            requires matching kernel BTF/CO-RE, task iterators, task-storage maps,
            pidfds and supported task helpers. It must refuse unsupported kernels.
          - Binder and userspace inspection require their particular tracepoints,
            kprobe/uprobe/perf support and matching target layouts. No universal
            Android release or kernel-version support guarantee is made.
          - Run ksightd probe --json and ksightd code-capabilities, then validate
            loading, attachment and real event output for the selected sensors.
            Read-only probing alone does not establish runtime compatibility.

          Historical device-test record from the existing v0.2.12 release notes:
          https://github.com/swyiic/KernSight/releases/tag/v0.2.12
          This workflow did not independently repeat that device test.
          Pixel 6a (bluejay, aarch64), BTF not available:
          Linux 6.1.124-android14-11-g061a6a266b80c-ab10015560-4k
          #1 SMP PREEMPT Sun Dec 01 08:10:00 UTC 2024
          Exercised phone copy: KernSight 0.2.12_011492a0
          SHA-256: 10f86a3346c212abd41fcd0eb4a24c57983d7f0e0ec00577ab5ba74e4a3e7c3d
          Path: /data/local/tmp/ksight/ksightd

          These assets were rebuilt by GitHub Actions and have new build suffixes.
          CI validates formatting, strict Clippy, workspace tests, vendored Aya
          perf-buffer tests, build identity and architecture checks. It does not
          run the released agent on an Android device. The recorded no-BTF test
          does not validate the BTF-dependent backend. Other devices and kernels,
          including other 6.1 builds, require their own runtime validation.
          EOF
          printf '\nSource commit: %s\nWorkflow: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.md
          # Never replace an existing release or retarget an existing tag.
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; refusing to overwrite assets."
            exit 1
          fi
          gh release create "$release_tag" release/* \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            "${prerelease_args[@]}" \
            --notes-file notes.md

